name: Test

on:
  push:
  pull_request:
    branches: [master, beta]

jobs:
  test:
    name: Test
    if: github.repository_owner == 'privatenumber' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: true

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm concurrently --names 'test,node20' 'pnpm test' 'pnpm dlx node@20.20.0 ./tests/node20-compat.js'

      - name: Lint
        run: pnpm lint
